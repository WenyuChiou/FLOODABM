# Decision mechanism: Bernoulli trial (u < p).
# decision_threshold=0.0 → pure stochastic; set to 0.5 for hybrid threshold+stochastic.
decision_threshold: 0.0
# Bounded random draw ranges per action.
# Each action's uniform draw u ~ U(low, high) instead of U(0,1).
# If p > high: deterministic adopt; if p < low: deterministic reject.
# Set to null for default U(0,1) behavior.
draw_bounds:
  FI: [0.35, 0.55]
  EH: [0.30, 0.60]
  BP: [0.25, 0.65]
  RL: [0.30, 0.95]
seed: 90334
# ==============================================================================
# Threat Perception (TP) Configuration
# ==============================================================================
# TP represents how much a household perceives flood threats (range: 0-1).
# Higher TP -> more likely to adopt protective actions (FI, EH, BP, RL).
#
# SHOCK MODEL (activated when flood ratio >= threshold):
#   Formula: TP' = min(1.0, TP + shock_scale × damage_ratio)
#   - Owner shock:  TP_owner' = TP_owner + shock_scale_owner × ratio
#   - Renter shock: TP_renter' = TP_renter + shock_scale_renter × ratio
#
# DECAY MODEL (every year without flood):
#   Formula: TP' = TP × exp(-λ × Δt)  where λ depends on PA, SC, τ(t)
#   See tp_decay_params for owner/renter decay parameters.
#
# TIMING MODES:
#   - "start": Shock first, then decay (TP boost fades within same year)
#   - "end":   Decay first, then shock (TP shock persists longer)
# ==============================================================================
tp_config:
  clip_hi: 1.0                  # Maximum TP value (upper bound)
  clip_lo: 0.0                  # Minimum TP value (lower bound)
  shock_mode: additive          # Shock type: "additive" (TP + scale*ratio)
  shock_scale_owner: 0.3        # Shock multiplier for owners
  shock_scale_renter: 0.3       # Shock multiplier for renters
  shock_timing: end             # When to apply shock: "start" or "end"
  skip_decay_on_shock: true     # If true, skip decay in years with flood shock
tp_decay_params:
  owner:
    alpha: 0.5000
    beta: 0.2167
    k: 0.03
    tau0: 1.0
    tau_inf: 33.2589
  renter:
    alpha: 0.3500
    beta: 0.1000
    k: 0.01
    tau0: 1.0
    tau_inf: 46.0431
years:
  end: 2023
  mode: span
  start: 2011
years_step: 1.0
